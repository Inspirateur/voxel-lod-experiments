<!doctype html>
<meta charset="utf-8">
<title>2D Grid LOD</title>
<style>
  body { margin: 0; height: 100vh; display: flex; font: 13px sans-serif; }
  section { flex: 1; min-width: 0; display: flex; flex-direction: column; border-left: 1px solid #888; }
  canvas { flex: 1; min-height: 0; width: 100%; }
  button { width: 40px; height: 24px; border: 1px solid #888; }
  .sel { outline: 3px solid #000; outline-offset: -3px; }
</style>
<section>
  <div id="palette">Left: paint · right-drag: pan · wheel: zoom<br></div>
  <canvas id="paint-canvas"></canvas>
</section>
<section id="lods">
  <label>LOD algorithm <select id="algo"></select></label>
</section>
<script type="module" src="js/main.js"></script>
